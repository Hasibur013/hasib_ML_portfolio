name: Update Google Scholar Stats

on:
  schedule:
    - cron: "0 0 * * 0" # Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-stats
  cancel-in-progress: true

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scholarly dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scholarly -c scripts/scholar-constraints.txt
          python -m pip uninstall -y bibtexparser || true
          python -m pip install --no-cache-dir "bibtexparser==1.4.3"
          python -c "import bibtexparser; from bibtexparser.bibdatabase import BibDatabase; import scholarly; print('ok', bibtexparser.__version__)"

      - name: Fetch Scholar stats
        env:
          SCHOLAR_ID: PyEMtfkAAAAJ
        run: python scripts/fetch_scholar_stats.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scholar_stats.json
          if git diff --staged --quiet; then
            echo "No Scholar stats changes."
          else
            git commit -m "chore: update Google Scholar stats"
            git push
          fi
